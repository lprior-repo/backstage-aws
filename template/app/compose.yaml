# Local development only. The CLI supplies a project-specific Compose name.
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: backstage
      POSTGRES_PASSWORD: backstage-local-only
    ports:
      - "127.0.0.1:${BACKSTAGE_DEV_POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d backstage"]
      interval: 1s
      timeout: 5s
      retries: 90
    stop_grace_period: 30s
volumes:
  postgres-data:
