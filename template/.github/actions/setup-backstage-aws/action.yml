name: Setup backstage-aws
description: Install Terraform and the backstage-aws CLI, and load one environment's settings.
inputs:
  environment:
    description: >-
      Optional committed settings file: `environments/<environment>.env`.
      Omit for offline validation.
    required: false
runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.17.2
        terraform_wrapper: false
    - name: Load settings
      if: inputs.environment != ''
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        set -a
        . "environments/$ENVIRONMENT.env"
        set +a
        delimiter="BACKSTAGE_AWS_$(cat /proc/sys/kernel/random/uuid)"
        for key in "${!BACKSTAGE_AWS_@}"; do
          printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "${!key}" "$delimiter" >> "$GITHUB_ENV"
        done
    - name: Download and verify backstage-aws
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        directory="$(mktemp -d)"
        gh release download "v__BACKSTAGE_AWS_CLI_VERSION__" \
          --repo "__BACKSTAGE_AWS_CLI_REPOSITORY__" \
          --pattern backstage-aws-x86_64-unknown-linux-gnu.tar.gz \
          --dir "$directory"
        gh attestation verify "$directory/backstage-aws-x86_64-unknown-linux-gnu.tar.gz" \
          --repo "__BACKSTAGE_AWS_CLI_REPOSITORY__"
        tar -xzf "$directory/backstage-aws-x86_64-unknown-linux-gnu.tar.gz" -C "$directory"
        chmod +x "$directory/backstage-aws"
        test "$("$directory/backstage-aws" --version)" = "backstage-aws __BACKSTAGE_AWS_CLI_VERSION__"
        "$directory/backstage-aws" check --release-archive "$directory/backstage-aws-x86_64-unknown-linux-gnu.tar.gz"
        echo "$directory" >> "$GITHUB_PATH"
