# Deploys `main` to production. It does nothing until production exists:
# `backstage-aws bootstrap --environment production` writes
# `environments/production.env`, and committing that file switches this on.
name: Deploy production environment
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_digest:
        description: Optional image digest to deploy
        required: false
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: backstage-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_DIGEST: ${{ inputs.image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: production
        run: |
          if [ -f environments/production.env ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No environments/production.env yet, so there is nothing to deploy."
          fi
      - uses: ./.github/actions/setup-backstage-aws
        if: steps.production.outputs.exists
        with:
          environment: production
      # The production role accepts runs on `main` only.
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v4.3.1
        if: steps.production.outputs.exists
        with:
          role-to-assume: ${{ env.BACKSTAGE_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.BACKSTAGE_AWS_AWS_REGION }}
          allowed-account-ids: ${{ env.BACKSTAGE_AWS_AWS_ACCOUNT_ID }}
          role-session-name: backstage-production-${{ github.run_id }}
      - if: steps.production.outputs.exists
        run: backstage-aws env up --scan --approve ${IMAGE_DIGEST:+--digest="$IMAGE_DIGEST"}
