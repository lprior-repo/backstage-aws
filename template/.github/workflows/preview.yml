# Everything this workflow knows is in three places: the settings file
# `environments/preview.env`, the pull request number, and one CLI command.
# Another CI system needs the same three things and nothing else.
name: Preview environment
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # GitHub starts no `pull_request` run for a pull request that has a merge
  # conflict, so teardown listens for `pull_request_target`. That job checks
  # out the base branch and never runs code from the pull request.
  pull_request_target:
    types: [closed]
permissions:
  contents: read
jobs:
  up:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A newer push waits for the running deployment: cancelling Terraform
    # mid-apply can leave the state locked.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backstage-aws
        with:
          environment: preview
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v4.3.1
        with:
          role-to-assume: ${{ env.BACKSTAGE_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.BACKSTAGE_AWS_AWS_REGION }}
          allowed-account-ids: ${{ env.BACKSTAGE_AWS_AWS_ACCOUNT_ID }}
          role-session-name: backstage-preview-${{ github.run_id }}
      # Builds, deploys, waits until the environment answers, then writes its
      # address on the pull request.
      - run: backstage-aws env up --approve
        env:
          BACKSTAGE_AWS_PULL_REQUEST: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
  down:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backstage-aws
        with:
          environment: preview
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v4.3.1
        with:
          role-to-assume: ${{ env.BACKSTAGE_AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.BACKSTAGE_AWS_AWS_REGION }}
          allowed-account-ids: ${{ env.BACKSTAGE_AWS_AWS_ACCOUNT_ID }}
          role-session-name: backstage-preview-cleanup-${{ github.run_id }}
      - run: backstage-aws env down --approve
        env:
          BACKSTAGE_AWS_PULL_REQUEST: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
