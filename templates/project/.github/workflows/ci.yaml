name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.14.0'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn test --watch=false --runInBand
      - run: yarn test:bootstrap
      - run: yarn lint:all
      - run: yarn build:backend
      - run: docker build -f packages/backend/Dockerfile -t backstage:ci .
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: '1.17.2'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/portal init -backend=false -input=false
      - run: terraform -chdir=infra/portal validate
      - run: terraform -chdir=infra/portal test
