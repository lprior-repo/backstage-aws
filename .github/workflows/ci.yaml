name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --lib --bins -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Initialize and check generated project offline
        env:
          BACKSTAGE_AWS_NAME: example-portal
          BACKSTAGE_AWS_AWS_ACCOUNT_ID: "123456789012"
          BACKSTAGE_AWS_AWS_REGION: us-east-1
          BACKSTAGE_AWS_DOMAIN_NAME: portal.example.com
          BACKSTAGE_AWS_ROUTE53_ZONE_ID: Z123456789ABC
          BACKSTAGE_AWS_GITHUB_REPOSITORY: example-owner/example-portal
          BACKSTAGE_AWS_OWNER_GITHUB_ID: "123456789"
          BACKSTAGE_AWS_BUDGET_EMAIL: budget@example.com
          BACKSTAGE_AWS_ALERT_EMAIL: alerts@example.com
          BACKSTAGE_AWS_ALLOWED_INGRESS_CIDRS: 192.0.2.0/24
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/backstage-aws-generated-$GITHUB_RUN_ID"
          target/release/backstage-aws init --output "$output"
          cd "$output"
          "$GITHUB_WORKSPACE/target/release/backstage-aws" check
