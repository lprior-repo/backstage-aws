name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install target and build release binary
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --locked --release --target "${{ matrix.target }}"
          binary="target/${{ matrix.target }}/release/backstage-aws"
          version="$("$binary" --version)"
          test "$GITHUB_REF_NAME" = "v${version#backstage-aws }"
          mkdir -p "dist/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/backstage-aws" "dist/${{ matrix.target }}/backstage-aws"
          tar -C "dist/${{ matrix.target }}" -czf "backstage-aws-${{ matrix.target }}.tar.gz" backstage-aws
          "$binary" check --release-archive "backstage-aws-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backstage-aws-${{ matrix.target }}
          path: backstage-aws-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: backstage-aws-*
          merge-multiple: true
      - uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: backstage-aws-*.tar.gz
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" backstage-aws-*.tar.gz
